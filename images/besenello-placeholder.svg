<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5D8FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4B5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB5D8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#grad1)"/>
  
  <!-- Mountains -->
  <polygon points="0,400 200,200 400,350 600,150 800,300 1000,100 1200,250 1200,600 0,600" fill="#8B95C9" opacity="0.3"/>
  <polygon points="100,450 300,250 500,400 700,200 900,350 1100,180 1200,300 1200,600 0,600" fill="#9BA8D4" opacity="0.4"/>
  
  <!-- Castle tower -->
  <rect x="500" y="280" width="200" height="250" fill="#C4AED6" opacity="0.6"/>
  <polygon points="500,280 600,200 700,280" fill="#B89FCC" opacity="0.6"/>
  
  <!-- Trees -->
  <circle cx="250" cy="480" r="40" fill="#A8C4A8" opacity="0.4"/>
  <circle cx="900" cy="500" r="35" fill="#A8C4A8" opacity="0.4"/>
  
  <!-- Text -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" opacity="0.8">Besenello</text>
</svg>
